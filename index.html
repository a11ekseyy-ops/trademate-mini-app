 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeMate - Конкурсы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .nav-tabs {
            display: flex;
            background: white;
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .contest-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .contest-card:hover {
            transform: translateY(-2px);
        }

        .contest-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .contest-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .contest-prize {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 10px;
        }

        .contest-description {
            color: #666;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .contest-full-description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .contest-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
        }

        .participants-count {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .participate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        .participate-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .participate-btn.participated {
            background: #f44336;
        }

        .participate-btn.ended {
            background: #9E9E9E;
            cursor: not-allowed;
        }

        .winner-badge {
            background: #4CAF50;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .admin-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .admin-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .admin-btn.delete {
            background: #f44336;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            height: 100px;
            resize: vertical;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-100%); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 25px;
            max-width: 350px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .contest-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-active {
            background: #4CAF50;
            color: white;
        }

        .status-ended {
            background: #f44336;
            color: white;
        }
        
        .sync-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
            display: none;
        }
        
        .sync-indicator.active {
            display: block;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        .error-message {
            background: #f44336;
            color: white;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
        }
        
        .retry-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎁 Конкурсы TradeMate</h1>
            <p>Участвуйте и выигрывайте призы!</p>
        </div>

        <div class="nav-tabs">
            <div class="nav-tab active" onclick="showSection('contests')">Активные</div>
            <div class="nav-tab" onclick="showSection('my-contests')">Мои конкурсы</div>
            <div class="nav-tab" id="adminTab" style="display: none;" onclick="showSection('admin')">Админ</div>
        </div>

        <!-- Активные конкурсы -->
        <div id="contests" class="content-section active">
            <div id="contestsList"></div>
        </div>

        <!-- Мои конкурсы -->
        <div id="my-contests" class="content-section">
            <div id="myContestsList"></div>
        </div>

        <!-- Админ панель -->
        <div id="admin" class="content-section">
            <div class="admin-section">
                <h3 style="margin-bottom: 15px;">Управление конкурсами</h3>
                <button class="admin-btn" onclick="showCreateContestForm()">➕ Создать конкурс</button>
                <button class="admin-btn" onclick="loadAdminContests()">📋 Все конкурсы</button>
                <button class="admin-btn" onclick="showWinners()">🏆 Победители</button>
                <button class="admin-btn" onclick="syncWithServer()">🔄 Синхронизировать</button>
            </div>

            <div id="createContestForm" style="display: none;">
                <div class="admin-section">
                    <h3 style="margin-bottom: 15px;">Создать конкурс</h3>
                    <div class="form-group">
                        <label>Название конкурса:</label>
                        <input type="text" id="contestTitle" placeholder="Введите название">
                    </div>
                    <div class="form-group">
                        <label>Описание:</label>
                        <textarea id="contestDescription" placeholder="Опишите условия конкурса"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Приз:</label>
                        <input type="text" id="contestPrize" placeholder="Что можно выиграть">
                    </div>
                    <div class="form-group">
                        <label>Дата окончания:</label>
                        <input type="datetime-local" id="contestEndDate">
                    </div>
                    <button class="admin-btn" onclick="createContest()">Создать конкурс</button>
                    <button class="admin-btn" style="background: #9E9E9E;" onclick="hideCreateContestForm()">Отмена</button>
                </div>
            </div>

            <div id="adminContestsList"></div>
        </div>
    </div>

    <!-- Модальное окно деталей конкурса -->
    <div id="contestModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeContestModal()">&times;</span>
            <div id="contestModalContent"></div>
        </div>
    </div>
    
    <!-- Индикатор синхронизации -->
    <div id="syncIndicator" class="sync-indicator">🔄 Синхронизация...</div>

    <script>
        // КОНФИГУРАЦИЯ - ЗАМЕНИТЕ НА ВАШ РЕАЛЬНЫЙ URL СЕРВЕРА
        // Получите URL из адресной строки серверного Replit и вставьте сюда
        const SERVER_URL = 'https://trademate-server.bossa11ekseyy.repl.co'; // ЗАМЕНИТЕ yourusername на ваш username
        
        const FALLBACK_STORAGE_KEY = 'trademate_contests_fallback';
        
        let tg = window.Telegram.WebApp;
        let user = null;
        let contests = [];
        let isAdmin = false;
        const UPDATE_INTERVAL = 10000; // 10 секунд

        // Инициализация
        tg.expand();
        tg.ready();

        // Получаем данные пользователя
        user = tg.initDataUnsafe?.user;
        
        // Проверяем, является ли пользователь администратором
        isAdmin = user && [5790425031].includes(user.id);

        // Показываем/скрываем админскую вкладку
        if (isAdmin) {
            document.getElementById('adminTab').style.display = 'block';
        }

        // Загружаем конкурсы при запуске
        initializeApp();

        async function initializeApp() {
            await loadContests();
            
            // Запускаем периодическое обновление
            setInterval(loadContests, UPDATE_INTERVAL);
        }

        // API функции
        async function apiRequest(endpoint, options = {}) {
            const url = `${SERVER_URL}${endpoint}`;
            
            try {
                showSyncIndicator();
                
                const config = {
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    ...options
                };
                
                if (options.body) {
                    config.body = JSON.stringify(options.body);
                }
                
                const response = await fetch(url, config);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                hideSyncIndicator();
                return data;
                
            } catch (error) {
                hideSyncIndicator();
                console.error('API request failed:', error);
                
                // Fallback to localStorage
                const fallbackData = getFromFallbackStorage(endpoint);
                if (fallbackData) {
                    console.log('Using fallback data from localStorage');
                    return fallbackData;
                }
                
                throw error;
            }
        }

        function getFromFallbackStorage(endpoint) {
            const fallbackData = localStorage.getItem(FALLBACK_STORAGE_KEY);
            if (!fallbackData) return null;
            
            const data = JSON.parse(fallbackData);
            
            switch(endpoint) {
                case '/contests':
                    return { contests: data.filter(c => c.isActive && new Date(c.endDate) > new Date()) };
                case '/contests/all':
                    return { contests: data };
                default:
                    return null;
            }
        }

        function saveToFallbackStorage(contestsData) {
            localStorage.setItem(FALLBACK_STORAGE_KEY, JSON.stringify(contestsData));
        }

        async function loadContests() {
            try {
                document.getElementById('contestsList').innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <div>Загрузка конкурсов...</div>
                    </div>
                `;

                const data = await apiRequest('/contests');
                contests = data.contests.map(contest => ({
                    ...contest,
                    endDate: new Date(contest.endDate),
                    createdAt: new Date(contest.createdAt)
                }));
                
                // Сохраняем в fallback storage
                saveToFallbackStorage(data.contests);
                
                displayContests();
                
            } catch (error) {
                console.error('Failed to load contests:', error);
                document.getElementById('contestsList').innerHTML = `
                    <div class="error-message">
                        ❌ Ошибка загрузки конкурсов
                        <button class="retry-btn" onclick="loadContests()">Повторить</button>
                    </div>
                `;
            }
        }

        async function loadAllContests() {
            try {
                const data = await apiRequest('/contests/all');
                contests = data.contests.map(contest => ({
                    ...contest,
                    endDate: new Date(contest.endDate),
                    createdAt: new Date(contest.createdAt)
                }));
                
                return contests;
            } catch (error) {
                console.error('Failed to load all contests:', error);
                throw error;
            }
        }

        async function createContestOnServer(contestData) {
            try {
                const response = await apiRequest('/contests', {
                    method: 'POST',
                    body: contestData
                });
                
                return response;
            } catch (error) {
                console.error('Failed to create contest:', error);
                throw error;
            }
        }

        async function updateContestOnServer(contestId, updateData) {
            try {
                await apiRequest(`/contests/${contestId}`, {
                    method: 'PUT',
                    body: updateData
                });
            } catch (error) {
                console.error('Failed to update contest:', error);
                throw error;
            }
        }

        async function deleteContestOnServer(contestId) {
            try {
                await apiRequest(`/contests/${contestId}`, {
                    method: 'DELETE'
                });
            } catch (error) {
                console.error('Failed to delete contest:', error);
                throw error;
            }
        }

        async function participateInContestOnServer(contestId, userId) {
            try {
                const response = await apiRequest(`/contests/${contestId}/participate/${userId}`, {
                    method: 'PUT'
                });
                
                return response.participants;
            } catch (error) {
                console.error('Failed to participate in contest:', error);
                throw error;
            }
        }

        function displayContests() {
            const contestsList = document.getElementById('contestsList');
            const currentTime = new Date();
            const activeContests = contests.filter(contest => 
                contest.isActive && contest.endDate > currentTime
            );

            if (activeContests.length === 0) {
                contestsList.innerHTML = `
                    <div class="empty-state">
                        <div>🎁</div>
                        <h3>Нет активных конкурсов</h3>
                        <p>Следите за обновлениями, скоро появятся новые конкурсы!</p>
                    </div>
                `;
                return;
            }

            contestsList.innerHTML = activeContests.map(contest => {
                const isParticipating = user && contest.participants.includes(user.id);
                const participantsCount = contest.participants.length;
                
                return `
                <div class="contest-card" onclick="showContestDetails('${contest.id}')">
                    <div class="contest-header">
                        <div style="flex: 1;">
                            <div class="contest-title">${contest.title}</div>
                            <div class="contest-description">${contest.description}</div>
                        </div>
                        <div class="contest-prize">${contest.prize}</div>
                    </div>
                    
                    <div class="contest-details">
                        <div class="participants-count">
                            👥 ${participantsCount} участников
                        </div>
                        <div>📅 До ${formatDate(contest.endDate)}</div>
                    </div>

                    <button class="participate-btn ${isParticipating ? 'participated' : ''}" 
                            onclick="event.stopPropagation(); participateInContest('${contest.id}')">
                        ${isParticipating ? '❌ Отказаться от участия' : '🎯 Участвовать'}
                    </button>
                </div>
            `}).join('');
        }

        function showContestDetails(contestId) {
            const contest = contests.find(c => c.id === contestId);
            if (!contest) return;

            const isParticipating = user && contest.participants.includes(user.id);
            const participantsCount = contest.participants.length;
            const isActive = contest.isActive && contest.endDate > new Date();

            const modalContent = `
                <div class="contest-header">
                    <div style="flex: 1;">
                        <div class="contest-title">${contest.title}</div>
                        <span class="contest-status ${isActive ? 'status-active' : 'status-ended'}">
                            ${isActive ? 'Активен' : 'Завершен'}
                        </span>
                    </div>
                    <div class="contest-prize">${contest.prize}</div>
                </div>
                
                <div class="contest-full-description">${contest.description}</div>
                
                <div class="contest-details">
                    <div class="participants-count">
                        👥 ${participantsCount} участников
                    </div>
                    <div>📅 До ${formatDateTime(contest.endDate)}</div>
                </div>

                <div class="contest-details">
                    <div>🏆 Приз: ${contest.prize}</div>
                </div>

                ${isActive ? `
                <button class="participate-btn ${isParticipating ? 'participated' : ''}" 
                        onclick="participateInContest('${contest.id}'); closeContestModal()">
                    ${isParticipating ? '❌ Отказаться от участия' : '🎯 Участвовать в конкурсе'}
                </button>
                ` : `
                <div style="text-align: center; padding: 15px; background: #ffebee; border-radius: 10px; margin-top: 15px;">
                    🏁 Конкурс завершен
                </div>
                `}
            `;

            document.getElementById('contestModalContent').innerHTML = modalContent;
            document.getElementById('contestModal').style.display = 'block';
        }

        function closeContestModal() {
            document.getElementById('contestModal').style.display = 'none';
        }

        async function participateInContest(contestId) {
            if (!user) {
                showNotification('❌ Войдите в аккаунт для участия');
                return;
            }

            try {
                const participants = await participateInContestOnServer(contestId, user.id);
                
                // Обновляем локальные данные
                const contest = contests.find(c => c.id === contestId);
                if (contest) {
                    contest.participants = participants;
                }
                
                const isParticipating = participants.includes(user.id);
                
                if (isParticipating) {
                    showNotification('🎉 Вы успешно присоединились к конкурсу!');
                } else {
                    showNotification('❌ Вы отказались от участия в конкурсе');
                }
                
                refreshAllDisplays();
                
            } catch (error) {
                showNotification('❌ Ошибка при участии в конкурсе');
            }
        }

        function loadMyContests() {
            const myContestsList = document.getElementById('myContestsList');
            if (!user) {
                myContestsList.innerHTML = `
                    <div class="empty-state">
                        <div>🔒</div>
                        <h3>Войдите в аккаунт</h3>
                        <p>Для просмотра ваших конкурсов необходимо авторизоваться</p>
                    </div>
                `;
                return;
            }

            const userContests = contests.filter(contest => 
                contest.participants.includes(user.id)
            );

            if (userContests.length === 0) {
                myContestsList.innerHTML = `
                    <div class="empty-state">
                        <div>🤔</div>
                        <h3>Вы пока не участвуете</h3>
                        <p>Выберите конкурс из списка активных и примите участие!</p>
                    </div>
                `;
                return;
            }

            myContestsList.innerHTML = userContests.map(contest => {
                const isActive = contest.isActive && contest.endDate > new Date();
                return `
                <div class="contest-card" onclick="showContestDetails('${contest.id}')">
                    <div class="contest-header">
                        <div style="flex: 1;">
                            <div class="contest-title">${contest.title}</div>
                            <div class="contest-description">${contest.description}</div>
                        </div>
                        <div class="contest-prize">${contest.prize}</div>
                    </div>
                    
                    <div class="contest-details">
                        <div class="participants-count">
                            👥 ${contest.participants.length} участников
                        </div>
                        <div>📅 До ${formatDate(contest.endDate)}</div>
                    </div>

                    <div style="text-align: center; padding: 10px; background: #E8F5E8; border-radius: 10px; margin-top: 10px;">
                        ✅ Вы участвуете в этом конкурсе
                        ${!isActive ? '<br><small>🏁 Конкурс завершен</small>' : ''}
                    </div>
                </div>
            `}).join('');
        }

        function showSection(sectionId) {
            // Скрываем все секции
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });

            // Убираем активный класс со всех вкладок
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Показываем выбранную секцию
            document.getElementById(sectionId).classList.add('active');

            // Активируем соответствующую вкладку
            event.target.classList.add('active');

            // Загружаем данные для секции
            if (sectionId === 'my-contests') {
                loadMyContests();
            } else if (sectionId === 'admin') {
                loadAdminContests();
            } else if (sectionId === 'contests') {
                displayContests();
            }
        }

        function refreshAllDisplays() {
            if (document.getElementById('contests').classList.contains('active')) {
                displayContests();
            }
            if (document.getElementById('my-contests').classList.contains('active')) {
                loadMyContests();
            }
            if (document.getElementById('admin').classList.contains('active')) {
                loadAdminContests();
            }
        }

        function showCreateContestForm() {
            document.getElementById('createContestForm').style.display = 'block';
            document.getElementById('adminContestsList').innerHTML = '';
            
            // Устанавливаем минимальную дату - завтра
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('contestEndDate').min = tomorrow.toISOString().slice(0, 16);
        }

        function hideCreateContestForm() {
            document.getElementById('createContestForm').style.display = 'none';
        }

        async function createContest() {
            const title = document.getElementById('contestTitle').value.trim();
            const description = document.getElementById('contestDescription').value.trim();
            const prize = document.getElementById('contestPrize').value.trim();
            const endDate = document.getElementById('contestEndDate').value;

            if (!title || !description || !prize || !endDate) {
                showNotification('❌ Заполните все поля');
                return;
            }

            try {
                const newContest = await createContestOnServer({
                    title: title,
                    description: description,
                    prize: prize,
                    endDate: endDate,
                    createdBy: user.id
                });

                // Добавляем в локальный список
                contests.push({
                    ...newContest,
                    endDate: new Date(newContest.endDate),
                    createdAt: new Date(newContest.createdAt)
                });
                
                showNotification('✅ Конкурс успешно создан!');
                hideCreateContestForm();
                refreshAllDisplays();

                // Очищаем форму
                document.getElementById('contestTitle').value = '';
                document.getElementById('contestDescription').value = '';
                document.getElementById('contestPrize').value = '';
                document.getElementById('contestEndDate').value = '';
                
            } catch (error) {
                showNotification('❌ Ошибка при создании конкурса');
            }
        }

        async function loadAdminContests() {
            const adminContestsList = document.getElementById('adminContestsList');
            document.getElementById('createContestForm').style.display = 'none';

            try {
                const allContests = await loadAllContests();
                
                if (allContests.length === 0) {
                    adminContestsList.innerHTML = `
                        <div class="empty-state">
                            <div>📋</div>
                            <h3>Нет созданных конкурсов</h3>
                            <p>Создайте первый конкурс!</p>
                        </div>
                    `;
                    return;
                }

                adminContestsList.innerHTML = allContests.map(contest => {
                    const isActive = contest.isActive && contest.endDate > new Date();
                    return `
                    <div class="contest-card">
                        <div class="contest-header">
                            <div style="flex: 1;">
                                <div class="contest-title">${contest.title}</div>
                                <div class="contest-description">${contest.description}</div>
                            </div>
                            <div class="contest-prize">${contest.prize}</div>
                        </div>
                        
                        <div class="contest-details">
                            <div class="participants-count">
                                👥 ${contest.participants.length} участников
                            </div>
                            <div>📅 До ${formatDateTime(contest.endDate)}</div>
                            <div class="contest-status ${isActive ? 'status-active' : 'status-ended'}">
                                ${isActive ? 'Активен' : 'Завершен'}
                            </div>
                        </div>

                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <button class="admin-btn" style="flex: 1; padding: 8px;" onclick="viewContestParticipants('${contest.id}')">
                                👥 Участники (${contest.participants.length})
                            </button>
                            <button class="admin-btn" style="flex: 1; padding: 8px; background: #4CAF50;" onclick="selectWinners('${contest.id}')" ${!isActive ? 'disabled' : ''}>
                                🏆 Выбрать победителей
                            </button>
                        </div>
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <button class="admin-btn" style="flex: 1; padding: 8px; background: ${isActive ? '#f44336' : '#9E9E9E'};" onclick="endContest('${contest.id}')" ${!isActive ? 'disabled' : ''}>
                                ${isActive ? '❌ Завершить' : '🔴 Завершен'}
                            </button>
                            <button class="admin-btn delete" style="flex: 1; padding: 8px;" onclick="deleteContest('${contest.id}')">
                                🗑️ Удалить
                            </button>
                        </div>
                    </div>
                `}).join('');
                
            } catch (error) {
                adminContestsList.innerHTML = `
                    <div class="error-message">
                        ❌ Ошибка загрузки конкурсов
                        <button class="retry-btn" onclick="loadAdminContests()">Повторить</button>
                    </div>
                `;
            }
        }

        function viewContestParticipants(contestId) {
            const contest = contests.find(c => c.id === contestId);
            if (!contest) return;

            if (contest.participants.length === 0) {
                showNotification('❌ Нет участников в этом конкурсе');
                return;
            }

            showNotification(`👥 Участников: ${contest.participants.length}`);
        }

        function selectWinners(contestId) {
            const contest = contests.find(c => c.id === contestId);
            if (!contest) return;

            if (contest.participants.length === 0) {
                showNotification('❌ Нет участников для выбора победителей');
                return;
            }

            showNotification('🎲 Победители выбраны случайным образом!');
        }

        async function endContest(contestId) {
            try {
                await updateContestOnServer(contestId, { isActive: false });
                
                // Обновляем локальные данные
                const contest = contests.find(c => c.id === contestId);
                if (contest) {
                    contest.isActive = false;
                }
                
                showNotification('✅ Конкурс завершен');
                refreshAllDisplays();
            } catch (error) {
                showNotification('❌ Ошибка при завершении конкурса');
            }
        }

        async function deleteContest(contestId) {
            if (!confirm('Вы уверены, что хотите удалить этот конкурс? Это действие нельзя отменить.')) {
                return;
            }

            try {
                await deleteContestOnServer(contestId);
                
                // Удаляем из локального списка
                contests = contests.filter(contest => contest.id !== contestId);
                
                showNotification('🗑️ Конкурс удален');
                refreshAllDisplays();
            } catch (error) {
                showNotification('❌ Ошибка при удалении конкурса');
            }
        }

        function showWinners() {
            const completedContests = contests.filter(contest => !contest.isActive);
            
            if (completedContests.length === 0) {
                showNotification('📭 Нет завершенных конкурсов');
                return;
            }

            showNotification('🏆 Победители будут объявлены после завершения конкурсов');
        }

        async function syncWithServer() {
            try {
                showNotification('🔄 Синхронизация с сервером...');
                await loadContests();
                showNotification('✅ Синхронизация завершена');
            } catch (error) {
                showNotification('❌ Ошибка синхронизации');
            }
        }

        function formatDate(date) {
            return date.toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        function formatDateTime(date) {
            return date.toLocaleString('ru-RU', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        function showSyncIndicator() {
            document.getElementById('syncIndicator').classList.add('active');
        }

        function hideSyncIndicator() {
            document.getElementById('syncIndicator').classList.remove('active');
        }

        // Закрытие модального окна при клике вне его
        window.onclick = function(event) {
            const modal = document.getElementById('contestModal');
            if (event.target === modal) {
                closeContestModal();
            }
        }

        // Обработка данных от Telegram Web App
        tg.onEvent('viewportChanged', () => {
            tg.expand();
        });
    </script>
</body>
</html>
